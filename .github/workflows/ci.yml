name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the package
        run: npm run build:bricks

      - name: Build CSS and JS bundles
        run: npm run build:bundle --workspace=packages/bricks

      - name: Test gallery metadata extraction
        run: node --test apps/gallery/plugins/story-manifest.test.mjs

      - name: Build gallery
        run: npm run build:gallery

      - name: Build Storybook
        run: npm run build-storybook --workspace=packages/bricks -- -o "$GITHUB_WORKSPACE/storybook-static"
